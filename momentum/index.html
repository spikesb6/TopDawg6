<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/></svg>
      </div>
      <div>
        <div class="brand-name">Momentum</div>
        <div class="brand-sub">Job control</div>
      </div>
    </div>
    <div id="nav" style="display:contents"></div>
    <div class="rail-spacer"></div>
    <div class="level-card" id="level"></div>
    <div class="rail-tools">
      <button class="btn sm ghost" data-action="theme" id="themeBtn" aria-label="Switch theme"></button>
      <button class="btn sm ghost" data-action="help" aria-label="Keyboard shortcuts">Shortcuts <kbd>?</kbd></button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="grow">
        <h1 class="page-title" id="pageTitle">Pulse</h1>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions">
        <span class="streak" id="streak" data-tip=""></span>
        <button class="search-btn" data-action="palette" aria-label="Search and commands">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search jobs, tasks, actions</span><kbd>⌘K</kbd>
        </button>
        <button class="btn hide-sm" data-action="new-task">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Task
        </button>
        <button class="btn primary" data-action="new-job">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New job
        </button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
