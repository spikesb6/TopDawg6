<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efeae0">
<title>Housepath</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23efeae0' width='32' height='32'/%3E%3Cpath d='M6 15 L16 7 L26 15 V26 H6 Z' fill='none' stroke='%231d5c40' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to the step</a>
<header class="top">
  <a class="brand" href="#today">Housepath</a>
  <div class="who">
    <label>House name
      <input id="project-name" maxlength="120" placeholder="Name this house" autocomplete="off">
    </label>
    <label>Place
      <input id="project-place" maxlength="160" placeholder="Town or lot" autocomplete="off">
    </label>
  </div>
  <div class="top-actions">
    <button id="pill" type="button" class="pill pill-unset">Set a limit</button>
    <button id="example" type="button" class="text-btn">See an example</button>
    <button id="erase" type="button" class="text-btn">Erase</button>
  </div>
</header>
<div class="layout">
  <nav class="rail" id="rail" aria-label="House path"></nav>
  <main id="main"></main>
</div>
<div id="dialog"></div>
<p id="announce" class="sr" role="status"></p>
<script type="module" src="js/app.js"></script>
</body>
</html>
