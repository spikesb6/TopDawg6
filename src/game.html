<title>Deed &amp; Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D board; HUD floats as blueprint-navy glass panels at the edges; gold = money/actions. */
:root{
  --ink:#0d1a2b;
  --panel:rgba(13,26,43,.84);
  --panel-solid:#132339;
  --line:rgba(190,215,240,.16);
  --text:#eef4fa;
  --muted:#9db1c7;
  --gold:#f5b83d;
  --gold-deep:#c98a12;
  --mint:#3fd49c;
  --coral:#ff6f61;
  --sky:#7cc4ff;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:linear-gradient(#8fd3ff,#e6f6ff);touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;gap:10px;padding-inline:16px;z-index:5}
.hud>*{pointer-events:auto}
.hud-top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hud-bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:center;align-items:flex-end}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(5,12,24,.35)}
#goalCard{padding:12px 14px;min-width:0;width:min(330px,100%)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
#goalCard h2{font-family:var(--display);font-weight:800;font-size:20px;margin:2px 0 8px;text-wrap:balance;line-height:1.1}
.goal{display:grid;gap:4px;margin-top:8px}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.goal-row b{font-weight:600}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:9px;transition:width .5s}
.goal.done .bar i{background:var(--mint)}
.goal.done .goal-row b::after{content:" ✓";color:var(--mint)}
#stats{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
.stat{padding:7px 11px;min-width:92px}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:16px;margin-top:1px;white-space:nowrap}
.stat.cash .v{color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.up{color:var(--mint)} .down{color:var(--coral)} .flat{color:var(--sky)}

#rollBtn{min-width:190px;padding:14px 26px;border-radius:18px;background:linear-gradient(180deg,#ffd166,var(--gold) 55%,var(--gold-deep));color:#2a1a00;font-family:var(--display);font-weight:800;font-size:21px;box-shadow:0 6px 0 #8a5a06,0 14px 30px rgba(0,0,0,.35);transition:transform .08s, filter .2s;display:flex;align-items:center;justify-content:center;gap:10px}
#rollBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a06,0 8px 20px rgba(0,0,0,.35)}
#rollBtn[disabled]{filter:grayscale(.7) brightness(.8);cursor:wait}
#rollBtn small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pips{display:grid;grid-template-columns:repeat(3,5px);gap:3px;padding:6px;background:#fff8e6;border-radius:7px}
.pips i{width:5px;height:5px;border-radius:50%}
.pips i.on{background:#2a1a00}
.side-btns{display:flex;gap:8px;align-items:flex-end}
.tool{padding:10px 12px;border-radius:13px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px}
.tool svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{border-color:rgba(245,184,61,.5)}
#rivals{position:fixed;left:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none}
.rival{padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#log{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(290px,calc(100% - 32px));display:flex;flex-direction:column;gap:4px;z-index:4;pointer-events:none;align-items:flex-end}
#log div{background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:10px;font-size:12px;color:var(--muted);animation:logIn .3s ease-out}
#log div b{color:var(--text);font-weight:600}
@keyframes logIn{from{transform:translateY(8px);opacity:.2}}

/* floating money text */
#floaters{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.floater{position:absolute;font-family:var(--display);font-weight:800;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:floatUp 1.6s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-70px}}

/* toast */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(380px,calc(100% - 32px))}
.toast{padding:9px 14px;border-radius:12px;background:var(--panel-solid);border:1px solid rgba(245,184,61,.45);font-weight:600;font-size:13px;animation:toast 3.2s ease forwards;text-align:center}
.toast em{font-style:normal;color:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,12,22,.45)}
#modal .card{width:min(470px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
#modal .card.wide{width:min(720px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#modal h3{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.08;margin:4px 0 10px;text-wrap:balance}
#modal p{line-height:1.5;color:#d6e2ee;margin:0 0 10px;max-width:62ch}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{flex:1 1 140px;padding:12px 14px;border-radius:13px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line);text-align:center;line-height:1.25}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.75;margin-top:2px}
.btn.primary{background:var(--gold);color:#2a1a00;border-color:transparent}
.btn.good{background:var(--mint);color:#032417;border-color:transparent}
.btn.danger{background:rgba(255,111,97,.16);border-color:rgba(255,111,97,.5);color:#ffc2bb}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn:not([disabled]):hover{filter:brightness(1.08)}
table.sheet{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.sheet td{padding:6px 0;border-bottom:1px dashed var(--line)}
.sheet td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.sheet tr.total td{border-bottom:0;border-top:1px solid rgba(255,255,255,.35);font-weight:700;padding-top:8px}
.sheet .neg{color:#ffa79d} .sheet .pos{color:var(--mint)}
.lesson{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(124,196,255,.09);border:1px solid rgba(124,196,255,.28);font-size:13px;line-height:1.5}
.lesson b{color:var(--sky);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.04em}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.check{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.check.ok{color:var(--mint);border-color:rgba(63,212,156,.4)}
.check.no{color:#ffa79d;border-color:rgba(255,111,97,.4)}
.quiz-opts{display:grid;gap:8px;margin-top:12px}
.quiz-opts .btn{text-align:left}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:15;background:var(--panel-solid);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px}
#drawer h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
#drawerBody{overflow:auto;padding:0 16px 24px;display:grid;gap:8px;align-content:start}
.prop-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;width:100%}
.prop-row .sub{font-size:12px;color:var(--muted)}
.term{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.term b{font-family:var(--display);font-size:16px}
.term p{margin:4px 0 0;font-size:13px;line-height:1.45;color:#d0dcea}
.term.locked{opacity:.45}
.x{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);font-size:18px}

/* screens */
.screen{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
#title{background:radial-gradient(ellipse at 50% 120%,rgba(13,26,43,.0),rgba(13,26,43,.55))}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,104px);line-height:.9;letter-spacing:-.03em;color:#fff;text-shadow:0 6px 0 var(--gold-deep),0 12px 40px rgba(0,0,0,.35);text-align:center}
.logo span{color:var(--gold);text-shadow:0 6px 0 #7a4f00,0 12px 40px rgba(0,0,0,.35)}
.tagline{font-size:17px;font-weight:600;margin:18px 0 26px;text-align:center;max-width:36ch;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.big-btn{padding:16px 40px;border-radius:18px;background:linear-gradient(180deg,#ffd166,var(--gold) 55%,var(--gold-deep));color:#2a1a00;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 6px 0 #8a5a06,0 16px 36px rgba(0,0,0,.35)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a06}
.rank{margin-top:18px;padding:8px 14px;font-size:13px}
#levels{background:rgba(9,18,31,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);justify-content:flex-start}
#levels h2{font-family:var(--display);font-weight:800;font-size:34px;margin:10px 0 4px}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:min(960px,100%);margin-top:18px}
.lvl{padding:14px;border-radius:16px;text-align:left;background:var(--panel-solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.lvl:not([disabled]):hover{border-color:var(--gold)}
.lvl[disabled]{opacity:.4;cursor:not-allowed}
.lvl .n{font-family:var(--mono);color:var(--gold);font-size:12px}
.lvl b{font-family:var(--display);font-size:18px;line-height:1.1}
.lvl .sub{font-size:12px;color:var(--muted)}
.lvl .stars{margin-top:auto;letter-spacing:2px;color:var(--gold);font-size:15px}
.lvl .stars .off{color:rgba(255,255,255,.18)}
.lvl .new{position:absolute;top:12px;right:12px}
.levels-top{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(960px,100%);flex-wrap:wrap}
.stars-big{font-size:40px;letter-spacing:6px;color:var(--gold);text-align:center;margin:6px 0}
.stars-big .off{color:rgba(255,255,255,.15)}

@media (max-width:720px){
  #stats{grid-template-columns:repeat(3,1fr);width:100%}
  #stats{gap:4px}
  .stat{min-width:0;padding:4px 8px;border-radius:10px}
  .stat .k{font-size:9px}
  .stat .v{font-size:13px}
  .hud-top{gap:6px}
  #goalCard{width:100%;padding:10px 12px}
  #goalCard h2{font-size:17px;margin-bottom:4px}
  #rivals{display:none}
  #log{bottom:calc(86px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px)}
  #log div:nth-child(n+3){display:none}
  #rollBtn{min-width:0;padding:12px 18px;font-size:18px}
  .tool{min-width:0;padding:11px;border-radius:12px}
  .tool .tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hud-bottom{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="stage"></div>

<div id="hudTop" class="hud hud-top" hidden>
  <div id="goalCard" class="glass"></div>
  <div id="stats"></div>
</div>
<div id="hudBottom" class="hud hud-bottom" hidden>
  <div class="side-btns">
    <button class="tool glass" id="btnPortfolio" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span class="tl">Portfolio</span></button>
    <button class="tool glass" id="btnBook" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg><span class="tl">Playbook</span></button>
  </div>
  <button id="rollBtn" type="button"><span class="pips" aria-hidden="true"><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i></span><span>Roll<small id="rollSub">Space to roll</small></span></button>
  <div class="side-btns">
    <button class="tool glass" id="btnCam" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12a9 9 0 0118 0M21 12a9 9 0 01-18 0"/></svg><span id="camLbl" class="tl">Follow</span></button>
    <button class="tool glass" id="btnMenu" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="tl">Levels</span></button>
  </div>
</div>
<div id="rivals" hidden></div>
<div id="log" aria-live="polite" hidden></div>
<div id="floaters"></div>
<div id="toasts"></div>

<aside id="drawer" aria-label="Side panel">
  <header><h3 id="drawerTitle">Portfolio</h3><button class="x" id="drawerClose" type="button" aria-label="Close">✕</button></header>
  <div id="drawerBody"></div>
</aside>

<section id="title" class="screen">
  <div class="logo">Deed <span>&amp;</span><br>Dice</div>
  <p class="tagline">Roll the dice, buy the block, and learn how real estate wealth is actually built.</p>
  <button class="big-btn" id="playBtn" type="button">Play</button>
  <div class="rank glass" id="rankBadge"></div>
</section>

<section id="levels" class="screen" hidden>
  <div class="levels-top">
    <div><div class="eyebrow">Your career</div><h2>Choose a city</h2><div id="rankLine" class="sub" style="color:var(--muted)"></div></div>
    <button class="btn" id="levelsBack" type="button" style="flex:0 0 auto">Back to board</button>
  </div>
  <div class="lvl-grid" id="lvlGrid"></div>
</section>

<div id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const money = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const short = n => { const a = Math.abs(n), s = n < 0 ? '-$' : '$';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e4) return s + Math.round(a / 1e3) + 'k';
  return s + Math.round(a).toLocaleString('en-US'); };
const pct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= Real estate model ================= */
const V = [0.4, 1, 1.9, 3.2, 5.2, 8.5];          // value multiple by building tier
const R = [0, 1, 2.1, 3.6, 6.2, 10.5];           // rent multiple by tier
const TIER = ['Vacant Lot', 'Single-Family Home', 'Duplex', 'Fourplex', 'Apartment Building', 'Mixed-Use Tower'];
const OPEX = 0.35;                                // taxes, insurance, repairs, management as share of gross rent
const HOODS = [
  { base: 55000, rent: 0.0115, appr: 0.000, vac: 0.08, cls: 'Class C', color: '#e0823a' },
  { base: 75000, rent: 0.0100, appr: 0.006, vac: 0.06, cls: 'Class B', color: '#3aa6dd' },
  { base: 98000, rent: 0.0090, appr: 0.013, vac: 0.05, cls: 'Class B+', color: '#d6508e' },
  { base: 125000, rent: 0.0080, appr: 0.022, vac: 0.04, cls: 'Class A', color: '#2fae66' },
];
const PHASES = [
  { name: 'Expansion', appr: 0.06, rate: 0.065, cls: 'up', lesson: 'Jobs are growing and buyers are competing. Prices rise fast, but so does the temptation to overpay.' },
  { name: 'Peak', appr: 0.015, rate: 0.075, cls: 'flat', lesson: 'Prices are at their highest and rates are up. Deals are thin. Smart investors build cash reserves here.' },
  { name: 'Correction', appr: -0.07, rate: 0.07, cls: 'down', lesson: 'Values fall. Owners with cash flow and fixed-rate loans can wait it out. Over-leveraged owners are forced to sell.' },
  { name: 'Recovery', appr: 0.03, rate: 0.055, cls: 'up', lesson: 'Prices are low and rates are easing. Historically, this is when patient buyers find the best deals.' },
];
const pmt = (P, r, n = 360) => r === 0 ? P / n : P * (r / 12) / (1 - Math.pow(1 + r / 12, -n));

/* ================= Playbook (glossary) ================= */
const TERMS = {
  cashflow: ['Cash Flow', 'Money left after rent pays every bill, including the mortgage. Positive cash flow pays you every month.'],
  noi: ['NOI', 'Net Operating Income: rent minus vacancy and operating expenses. Mortgage payments are not included.'],
  caprate: ['Cap Rate', 'NOI ÷ price. A quick way to compare deals as if you paid all cash. Higher cap rate means more income per dollar.'],
  onepercent: ['The 1% Rule', 'A screening shortcut: monthly rent should be at least 1% of the purchase price.'],
  fiftypercent: ['The 50% Rule', 'Expect operating expenses (not the mortgage) to eat about half of rent over time. This game uses 35% plus vacancy.'],
  mortgage: ['Mortgage', 'A loan secured by the property. You make monthly payments of principal and interest, usually for 30 years.'],
  downpayment: ['Down Payment', 'The cash you put in upfront. Investment loans typically need 20–25% down.'],
  leverage: ['Leverage', 'Using borrowed money to control more property. It multiplies gains and losses.'],
  closing: ['Closing Costs', 'Fees to finalize a purchase: lender fees, title, appraisal. Usually 2–5% of the price.'],
  equity: ['Equity', 'What you truly own: property value minus the loan balance.'],
  vacancy: ['Vacancy', 'Months a unit sits empty. Budget 4–10% of rent for it, depending on the neighborhood.'],
  capex: ['CapEx', 'Capital expenditures: big, infrequent costs like roofs, HVAC and water heaters.'],
  reserves: ['Reserves', 'Cash set aside for surprises. A common target is 3–6 months of expenses per property.'],
  appreciation: ['Appreciation', 'The rise in a property\'s value over time from the market, inflation and demand.'],
  forced: ['Forced Appreciation', 'Raising value yourself by renovating or adding units, instead of waiting on the market.'],
  ltv: ['Loan-to-Value', 'Loan balance ÷ property value. Lenders usually cap refinances around 75% LTV.'],
  refi: ['Cash-Out Refinance', 'Replacing your loan with a bigger one based on today\'s value, and pocketing the difference.'],

  const themeKey = THEME_ORDER[(e + 1) % THEME_ORDER.length];

    [['tier', 5], ['props', 8]],
    [['nw', Math.round(6e6 * Math.pow(1.5, e) / 1e5) * 1e5], ['sets', 1]],
  ];

function annual(t) {

}

  }

    const choice = await modal({ eyebrow: 'Cash crunch', title: 'You\'re ' + short(-G.me.cash) + ' short', body: `<p>You can\'t cover this bill. Choose a property to sell. You\'ll receive its value minus 7% selling costs, minus the loan payoff.</p>${lessonBox('reserves', 'Investors who keep 3–6 months of expenses in reserve rarely face a forced sale, which usually happens at the worst possible time.')}`,

}

/* ---- the turn ---- */
async function playerTurn() {
  if (!G || G.busy || G.over || modalOpen) return;
  const game = G, gone = () => G !== game || G.over;
  G.busy = true; updateHUD(); cam.idle = false;
  const [a, b] = await rollDice();
  log(`You rolled <b>${a} + ${b}</b>`);
  await wait(250);
  await moveToken(G.me, a + b);
  hideDice();
  if (!gone()) await resolveTile(G.me);
  if (gone()) return;
  if (goalsMet()) return winLevel();
  for (const r of G.players.slice(1)) { if (gone()) return; await rivalTurn(r); }
  if (gone()) return;
  G.turnsLeft--; G.turnCount++;
  cam.goal.set(0, 0, 0);
  if (goalsMet()) return winLevel();
  if (G.turnsLeft <= 0) return failLevel('You ran out of turns before reaching the goal.');
  G.busy = false; updateHUD();
}
async function moveToken(p, steps) {
  for (let s = 0; s < steps; s++) {
    const from = p.token.position.clone(); p.pos = (p.pos + 1) % 24; const to = slotPos(p, p.pos);

}

      if (await charge(p, rent, p.token.position.clone().setY(2))) owner.cash += rent;

    } else {

      if (owner.isYou) { floatAt(t.group.position.clone().setY(2), '+' + short(rent) + ' rent', '#ffd166'); sfx('coin'); log(`<b>${esc(p.name)}</b> paid you ${money(rent)} rent`); }
      else log(`<b>${esc(p.name)}</b> paid ${esc(owner.name)} ${short(rent)}`);

}

  if (mine.length) { rows.push(['Rent collected (' + mine.length + ' propert' + (mine.length > 1 ? 'ies' : 'y') + ')', mine.reduce((s, t) => s + annual(t).gross, 0)], ['Vacancy', -mine.reduce((s, t) => s + annual(t).vac, 0)], ['Taxes, insurance, repairs', -mine.reduce((s, t) => s + annual(t).opex, 0)]); if (debtT) rows.push(['Mortgage payments', -debtT]); sum += noiT - debtT; }
  rows.push(['Cash in the bank', sum, 'total']);
  // market & appreciation

  const nwBefore = netWorth(G.me);
  let principal = 0;
  G.tiles.forEach(t => {
    if (t.kind !== 'prop') return;
    t.idx *= 1 + ph.appr + HOODS[t.hood].appr + rnd(-0.01, 0.01); t.rentIdx *= 1.025;
    if (t.loan) { let paid = 0; for (let m = 0; m < 12; m++) { const int = t.loan.bal * t.loan.rate / 12; const pr = Math.min(t.loan.bal, t.loan.payment - int); t.loan.bal -= pr; paid += pr; } if (t.owner === 0) principal += paid; t.loan.int = t.loan.bal * t.loan.rate; }
  });
  G.me.cash += sum;
  const nwAfter = netWorth(G.me);
  const apprGain = nwAfter - nwBefore - sum - principal;
  G.year++;
  let phaseNote = '';
  if (G.phase >= 0 && Math.random() < 0.35) { G.phase = (G.phase + 1) % 4; G.rate = PHASES[G.phase].rate; phaseNote = `<p>The market moved into <b>${PHASES[G.phase].name}</b>. ${PHASES[G.phase].lesson}</p>`; }
  G.tiles.forEach(t => t.kind === 'prop' && t.owner < 0 && drawTileLabel(t));

  coinBurst(G.tiles[0], 14);
  const wealth = mine.length ? `<p>Your wealth grew three ways this year:</p>` + sheet([['1 · Cash flow', noiT - debtT], ['2 · Loan paydown (tenants pay your principal)', principal], ['3 · Appreciation', apprGain]]) : '';
  await modal({ eyebrow: 'Payday · end of year ' + (G.year - 1), title: 'Annual statement', body: sheet(rows) + wealth + phaseNote + lessonBox(mine.length ? pick(['cashflow', 'amort', 'appreciation', 'equity']) : 'househack'), buttons: [{ label: 'Collect ' + short(sum), value: 1, kind: 'primary' }] });
  learn('amort', true); learn('equity', true); if (mine.length) learn('appreciation', true);
  updateHUD();
}

  const c = await modal({ eyebrow: 'Bank', title: 'Today\'s rate: ' + pct(G.rate, 2), body: `<p>A ${short(100000 * G.L.m)} loan at this rate costs ${money(pmt(100000 * G.L.m, G.rate))}/mo over 30 years.</p>` + (G.L.unlocks.has('refi') ? (opts.length ? '<p>These properties have enough equity for a cash-out refinance at 75% LTV:</p>' : '<p>None of your properties has enough equity to refinance yet. Build or wait for appreciation.</p>') + lessonBox('ltv') : lessonBox('fixedrate')), buttons: btns });
  if (c >= 0) doRefi(G.tiles[c]);
}
async function marketTile() {
  if (G.phase < 0) { const b = Math.round(1000 * G.L.m); gain(G.me, b, G.me.token.position.clone().setY(2)); learn('comps', true); return modal({ eyebrow: 'Market Watch', title: 'Coffee with a mentor', body: `<p>A veteran investor walks you through reading comps. You gain a tip worth ${money(b)}.</p>` + lessonBox('comps') }); }
  G.phase = (G.phase + 1) % 4; G.rate = PHASES[G.phase].rate; learn('cycle', true);
  const ph = PHASES[G.phase];
  await modal({ eyebrow: 'Market Watch', title: 'The market enters ' + ph.name, body: `<p>${ph.lesson}</p>` + sheet([['Yearly appreciation', (ph.appr >= 0 ? '+' : '') + pct(ph.appr)], ['New mortgage rate', pct(ph.rate, 2)]]) + lessonBox('cycle') });
  updateHUD();
}
async function taxTile() {
  if (!G.L.unlocks.has('tax')) return modal({ eyebrow: 'Tax Office', title: 'Nothing due, yet', body: '<p>Rental profit is taxable income, but investors get powerful deductions. Taxes unlock in Level 8.</p>' + lessonBox('depreciation') });
  const mine = owned(0);
  const noi = mine.reduce((s, t) => s + annual(t).noi, 0), interest = mine.reduce((s, t) => s + (t.loan ? t.loan.bal * t.loan.rate : 0), 0), dep = mine.reduce((s, t) => s + t.basis * 0.8 / 27.5, 0);
  const taxable = noi - interest - dep, tax = Math.max(0, taxable) * 0.24;
  learn('depreciation', true);
  await modal({ eyebrow: 'Tax Office', title: tax > 0 ? 'Tax bill: ' + money(tax) : 'You owe nothing', body: sheet([['Rental NOI', noi], ['Mortgage interest deduction', -interest], ['Depreciation (building ÷ 27.5 yrs)', -dep], ['Taxable rental income', taxable, 'total']]) + `<p>${tax > 0 ? 'Taxed at 24%.' : 'Deductions wiped out your taxable rental income on paper, even though you still collected the cash.'}</p>` + lessonBox('depreciation'), buttons: [{ label: tax > 0 ? 'Pay ' + short(tax) : 'Nice', value: 1, kind: 'primary' }] });
  if (tax > 0) await charge(G.me, tax, G.me.token.position.clone().setY(2));
  updateHUD();
}
async function inspectTile() {
  const mine = owned(0).filter(t => t.tier > 0);
  if (!mine.length) return modal({ eyebrow: 'Inspection', title: 'Shadow an inspector', body: '<p>You tag along on a home inspection: foundation cracks, roof age, electrical panels, water heaters. Now you know what to look for.</p>' + lessonBox('inspection') });
  const t = pick(mine), cost = valueOf(t) * 0.006;
  await modal({ eyebrow: 'Inspection', title: 'Annual upkeep at ' + esc(t.name), body: '<p>The water heater and HVAC need servicing. Regular maintenance keeps small problems from becoming CapEx disasters.</p>' + sheet([['Maintenance', -cost]]) + lessonBox('capex'), buttons: [{ label: 'Pay ' + short(cost), value: 1, kind: 'primary' }] });
  learn('capex', true);
  await charge(G.me, cost, t.group.position.clone().setY(2));
}
async function vacancyTile() {
  const mine = owned(0).filter(t => t.tier > 0);
  if (!mine.length) return modal({ eyebrow: 'Turnover', title: 'Empty units cost money', body: '<p>Every month a unit sits empty, the mortgage and bills still come due. Budget for vacancy in every deal.</p>' + lessonBox('vacancy') });
  const t = pick(mine), cost = monthlyRent(t) + (t.loan ? t.loan.payment * 0 : 0) + monthlyRent(t) * 0.3;
  await modal({ eyebrow: 'Turnover', title: 'A tenant moved out of ' + esc(t.name), body: '<p>One month of lost rent plus cleaning and painting before the next tenant arrives.</p>' + sheet([['Lost rent', -monthlyRent(t)], ['Turnover costs', -monthlyRent(t) * 0.3]]) + lessonBox('vacancy'), buttons: [{ label: 'Pay ' + short(cost), value: 1, kind: 'primary' }] });
  learn('vacancy', true);
  await charge(G.me, cost, t.group.position.clone().setY(2));
}

/* ---- win / lose ---- */
async function winLevel() {
  G.over = true; G.busy = false; updateHUD(); sfx('win');
  const L = G.L, frac = G.turnsLeft / L.turns, stars = frac >= 0.4 ? 3 : frac >= 0.15 ? 2 : 1;
  const prev = SAVE.stars[G.li] || 0; SAVE.stars[G.li] = Math.max(prev, stars); SAVE.max = Math.max(SAVE.max, G.li + 1); persist();
  addXP(150 * stars + (L.endless ? 200 : 0));
  owned(0).forEach(t => coinBurst(t, 6));
  const nextL = getLevel(G.li + 1);
  const c = await modal({ eyebrow: 'Level ' + L.num + ' complete', title: esc(L.title), body: `<div class="stars-big">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>` +
    sheet([['Net worth', money(netWorth(G.me))], ['Properties owned', owned(0).length + ''], ['Cash flow per year', passive(0), ''], ['Years played', G.year - 1 + ''], ['Turns to spare', G.turnsLeft + '']]) +
    `<p>Next up: <b>${esc(nextL.title)}</b> in ${esc(THEMES[nextL.theme].name)}.</p>`, buttons: [{ label: 'Next level', value: 'next', kind: 'primary' }, { label: 'Replay', value: 'replay' }, { label: 'Level map', value: 'map' }] });
  if (c === 'next') startLevel(G.li + 1); else if (c === 'replay') startLevel(G.li); else showLevels();
}
function failLevel(why, term) {
  G.over = true; G.busy = false; updateHUD(); sfx('bad');
  setTimeout(() => failModal(why, term), 60);
}
async function failModal(why, term) {
  const c = await modal({ eyebrow: 'Level not completed', title: 'So close', body: `<p>${why}</p>` + G.L.goals.map(g => { const s = goalState(g); return `<div class="goal ${s.done ? 'done' : ''}"><div class="goal-row"><b>${s.label}</b><span class="num">${s.show}</span></div><div class="bar"><i style="width:${s.p * 100}%"></i></div></div>`; }).join('') + lessonBox(term || 'leverage', term ? undefined : 'Tip: mortgages let you buy more properties sooner, renovating creates instant equity, and cheaper neighborhoods cash flow best.'), buttons: [{ label: 'Try again', value: 'replay', kind: 'primary' }, { label: 'Level map', value: 'map' }] });
  if (c === 'replay') startLevel(G.li); else showLevels();
}

/* ================= Screens & panels ================= */
async function startLevel(li) {
  $('#title').hidden = true; $('#levels').hidden = true;
  newGame(li);
  $('#hudTop').hidden = false; $('#hudBottom').hidden = false; $('#rivals').hidden = false; $('#log').hidden = false;
  document.fonts && document.fonts.ready.then(() => G.tiles.forEach(drawTileLabel));
  const L = G.L;
  G.busy = true; updateHUD();
  await modal({ eyebrow: 'Level ' + L.num + ' · ' + esc(THEMES[L.theme].name), title: esc(L.title), body: `<p>${L.intro}</p>` +
    `<div class="goal" style="margin-top:12px"><div class="eyebrow">Goal · ${L.turns} turns</div></div>` + L.goals.map(g => `<div class="goal-row" style="margin-top:6px"><b>${goalState(g).label}</b></div>`).join('') +
    sheet([['Starting cash', money(L.cash)], ['Salary saved each year', money(L.salary)], ['Rival investors', L.rivals ? L.rivals + '' : 'None']]), buttons: [{ label: 'Start', value: 1, kind: 'primary' }] });
  (L.terms || []).forEach(t => learn(t, true));
  G.busy = false; updateHUD();
}
function showLevels() {
  const grid = $('#lvlGrid'); grid.innerHTML = '';
  const total = Math.max(LEVELS.length, SAVE.max + 1) + (SAVE.max >= LEVELS.length - 1 ? 1 : 0);
  for (let i = 0; i < total; i++) {
    const L = getLevel(i), locked = i > SAVE.max, st = SAVE.stars[i] || 0;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'lvl'; b.disabled = locked;
    b.innerHTML = `<span class="n">${L.endless ? 'EXPANSION' : 'LEVEL ' + L.num}</span><b>${esc(L.endless ? THEMES[L.theme].name : L.title)}</b><span class="sub">${esc(L.endless ? 'Endless mode · ' + L.goals.map(g => goalShort(g)).join(', ') : THEMES[L.theme].name + ' · ' + L.goals.map(g => goalShort(g)).join(', '))}</span>` +
      (locked ? `<span class="stars"><span class="off">Locked</span></span>` : `<span class="stars">${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></span>`) + (i === SAVE.max && !st ? '<span class="new tag" style="background:var(--gold);color:#2a1a00">Next</span>' : '');
    b.onclick = () => startLevel(i);
    grid.appendChild(b);
  }
  const r = rankOf(SAVE.xp);
  $('#rankLine').textContent = `${r.name} · ${SAVE.xp} XP${r.next ? ' · ' + (r.next[1] - SAVE.xp) + ' XP to ' + r.next[0] : ''} · ${SAVE.terms.length}/${Object.keys(TERMS).length} Playbook terms`;
  $('#levelsBack').hidden = !G || G.over;
  $('#levels').hidden = false; $('#title').hidden = true;
}
function goalShort(g) { const [t, n] = g; return { props: n + ' properties', nw: short(n) + ' net worth', cf: short(n) + '/yr cash flow', tier: 'build a ' + TIER[n].split(' ').slice(-1)[0].toLowerCase(), sets: n + ' neighborhood' + (n > 1 ? 's' : '') }[t]; }
function openDrawer(kind) {
  const d = $('#drawer'), body = $('#drawerBody');
  if (kind === 'portfolio') {
    $('#drawerTitle').textContent = 'Portfolio';
    const mine = owned(0);
    const eq = mine.reduce((s, t) => s + valueOf(t) - (t.loan ? t.loan.bal : 0), 0), debt = mine.reduce((s, t) => s + (t.loan ? t.loan.bal : 0), 0);
    body.innerHTML = `<div class="glass" style="padding:12px 14px">${sheet([['Cash', money(G.me.cash)], ['Property value', money(eq + debt)], ['Mortgage debt', -debt], ['Equity', money(eq)], ['Cash flow per year', passive(0), 'total']])}</div>` +
      (mine.length ? '' : '<p style="color:var(--muted);line-height:1.5">You don\'t own anything yet. Roll the dice and buy a property you land on. Tap any tile on the board to see its numbers.</p>');
    mine.sort((a, b) => a.i - b.i).forEach(t => {
      const a = annual(t), row = document.createElement('button'); row.type = 'button'; row.className = 'prop-row';
      row.innerHTML = `<span class="dot" style="background:${HOODS[t.hood].color}"></span><span><b>${esc(t.name)}</b><div class="sub">${TIER[t.tier]} · ${short(valueOf(t))} value</div></span><span class="num" style="color:${a.cf >= 0 ? 'var(--mint)' : 'var(--coral)'}">${short(a.cf)}/yr</span>`;
      row.onclick = () => { d.classList.remove('open'); propertyPanel(t); };
      body.appendChild(row);
    });
  } else {
    $('#drawerTitle').textContent = 'Playbook';
    const ids = Object.keys(TERMS);
    body.innerHTML = `<p style="color:var(--muted);margin:0 0 4px">${SAVE.terms.length} of ${ids.length} terms learned. Land on Academy tiles and read the lessons to unlock more.</p>` +
      ids.sort((a, b) => SAVE.terms.includes(b) - SAVE.terms.includes(a)).map(id => SAVE.terms.includes(id) ? `<div class="term"><b>${TERMS[id][0]}</b><p>${TERMS[id][1]}</p></div>` : `<div class="term locked"><b>Locked term</b><p>Keep playing to discover it.</p></div>`).join('');
  }
  d.classList.add('open');
}

/* ================= Wiring ================= */
$('#rollBtn').onclick = () => { sfx('hop'); playerTurn(); };
$('#btnPortfolio').onclick = () => openDrawer('portfolio');
$('#btnBook').onclick = () => openDrawer('book');
$('#drawerClose').onclick = () => $('#drawer').classList.remove('open');
$('#btnMenu').onclick = () => { if (G && G.busy) return; showLevels(); };
$('#levelsBack').onclick = () => { $('#levels').hidden = true; };
$('#btnCam').onclick = () => { cam.follow = !cam.follow; $('#camLbl').textContent = cam.follow ? 'Follow' : 'Free cam'; if (!cam.follow) cam.goal.set(0, 0, 0); };
$('#playBtn').onclick = () => { sfx('coin'); if (SAVE.max === 0 && !SAVE.stars[0]) startLevel(0); else showLevels(); };
window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && G && $('#modal').hidden && $('#title').hidden && $('#levels').hidden && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); playerTurn(); }
  if (e.code === 'Escape') $('#drawer').classList.remove('open');
});
function refreshRank() { const r = rankOf(SAVE.xp); $('#rankBadge').innerHTML = `<b>${r.name}</b> · ${SAVE.xp} XP · ${Object.keys(SAVE.stars).length} of ${LEVELS.length} cities cleared`; }

/* ---- render loop ---- */
let last = performance.now(), tAcc = 0;
function frame(now) {
  const dt = Math.min(50, now - last); last = now; tAcc += dt / 1000;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i], e = Math.min(1, (now - tw.t0) / tw.ms); tw.fn(e); if (e >= 1) { tweens.splice(i, 1); tw.res(); } }
  if (cam.idle || !$('#title').hidden) cam.theta += dt * 0.00006;
  placeCamera();
  spinners.forEach(s => {
    if (s.spin) s.o.rotation.y += s.spin; if (s.spinY) s.o.rotation.y += s.spinY;
    if (s.pulse) s.o.scale.setScalar(1 + Math.sin(tAcc * 5) * 0.12);
    if (s.cloud) { s.o.position.x += s.cloud; if (s.o.position.x > 90) s.o.position.x = -90; }
    if (s.boat !== undefined) { s.boat += 0.0008; s.o.position.set(Math.cos(s.boat) * 30, -0.3 + Math.sin(tAcc * 2 + s.boat * 9) * 0.08, Math.sin(s.boat) * 30); s.o.rotation.y = -s.boat; }
  });
  cars.forEach(c => { c.s = (c.s + c.v * dt / 1000) % 1; const L = 8.8, per = c.s * 4, side = Math.floor(per), f = per - side; const pts = [[L, L], [-L, L], [-L, -L], [L, -L]]; const [ax, az] = pts[side], [bx, bz] = pts[(side + 1) % 4]; c.o.position.set(ax + (bx - ax) * f, 0.1, az + (bz - az) * f); c.o.rotation.y = [Math.PI, Math.PI / 2, 0, -Math.PI / 2][side]; });
  blinkers.forEach(b => b.visible = Math.sin(tAcc * 4) > 0);
  if (G) G.players.forEach(p => { if (p.token && !G.busy) p.token.rotation.y += 0.01; });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---- boot: show a living demo board behind the title ---- */
resize();
newGame(Math.min(SAVE.max, LEVELS.length - 1));
cam.idle = true; cam.radius = innerWidth < innerHeight ? 70 : 46;
G.tiles.filter(t => t.kind === 'prop').forEach((t, k) => { if (k % 3 !== 2) { t.owner = k % 2 ? 0 : (G.players[1] ? 1 : 0); t.tier = 1 + (k % 4); setBuilding(t, false); } });
G.over = true;
refreshRank();
requestAnimationFrame(frame);
document.fonts && document.fonts.ready.then(() => G && G.tiles.forEach(drawTileLabel));
window.__dd = { get G() { return G; }, startLevel, playerTurn, setBuilding, SAVE };
})();
</script>
