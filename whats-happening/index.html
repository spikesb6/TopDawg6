<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="See what's happening around you: markets, music, movies, festivals and places to eat, with a safety brief for every outing.">
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What's Happening">
<title>What's Happening</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* What's Happening: a going-out companion. Warm "golden hour" palette for the fun side,
   a calm green for everything safety. Mobile-first, one column, bottom tab bar. */
:root {
  --bg: #FBF6EE; --surface: #FFFFFF; --surface-2: #F3ECE0;
  --ink: #1E1A15; --muted: #6B6358; --line: #E6DCCB;
  --accent: #E2502A; --accent-ink: #FFFFFF; --accent-soft: #FCE3D8;
  --safe: #1B7A57; --safe-soft: #DDF1E7;
  --warn: #9A6200; --warn-soft: #FBEBC8;
  --alert: #B3261E; --alert-soft: #FADCD9;
  --shadow: 0 1px 2px rgba(60,40,10,.06), 0 6px 20px rgba(60,40,10,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161A; --surface: #1D2026; --surface-2: #262A31;
    --ink: #F3EEE6; --muted: #A8A195; --line: #32363E;
    --accent: #FF7A52; --accent-ink: #1A0D07; --accent-soft: #3A2219;
    --safe: #5FD3A4; --safe-soft: #17332A;
    --warn: #F2BE5C; --warn-soft: #3A2E14;
    --alert: #FF8A80; --alert-soft: #40201D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.1; letter-spacing: -.01em; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: 0 16px calc(92px + env(safe-area-inset-bottom)); }

/* header */
.top { display: flex; align-items: center; gap: 8px; padding: calc(14px + env(safe-area-inset-top)) 0 10px; }
.brand { font: 800 21px/1 var(--f-display); letter-spacing: -.02em; margin-right: auto; white-space: nowrap; }
.brand i { font-style: normal; color: var(--accent); }
.loc-btn { display: inline-flex; align-items: center; gap: 6px; min-width: 0; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 500; font-size: 14px; }
.loc-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 17px; }

/* shared */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.safe { background: var(--safe); border-color: var(--safe); color: var(--bg); }
.btn.danger { background: var(--alert); border-color: var(--alert); color: var(--bg); }
.btn.block { display: flex; width: 100%; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.section-h h2 { font-size: 20px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.toggle[aria-pressed="true"] { background: var(--safe); border-color: var(--safe); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.tag.safe { background: var(--safe-soft); color: var(--safe); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.alert { background: var(--alert-soft); color: var(--alert); }
.tag.sample { border: 1px dashed var(--line); background: transparent; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; min-height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.search { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; margin-bottom: 8px; }

/* safety strip on Discover */
.brief { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-top: 6px; border-radius: 18px; border: 1px solid transparent; }
.brief.ok { background: var(--safe-soft); color: var(--safe); }
.brief.warn { background: var(--warn-soft); color: var(--warn); }
.brief.alert { background: var(--alert-soft); color: var(--alert); }
.brief .ico { font-size: 26px; }
.brief b { display: block; font: 700 16px/1.2 var(--f-display); }
.brief small { display: block; color: var(--ink); opacity: .8; font-size: 13px; margin-top: 2px; }
.brief .go { margin-left: auto; font-weight: 600; font-size: 13px; white-space: nowrap; }

/* event + place cards */
.list { display: grid; gap: 12px; }
.item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; width: 100%; text-align: left; padding: 14px; }
.item > div { min-width: 0; }
.item .badge { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: var(--accent-soft); overflow: hidden; }
.item .badge img { width: 100%; height: 100%; object-fit: cover; }
.item h3 { font-size: 17px; margin-bottom: 3px; overflow-wrap: anywhere; }
.item .meta { font-size: 14px; color: var(--muted); }
.item .when { font-weight: 600; color: var(--accent); font-size: 14px; }
.item .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.open { color: var(--safe); font-weight: 600; }
.closed { color: var(--muted); }
.soon { color: var(--warn); font-weight: 600; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 8px; margin: 0 -16px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 168px; padding: 12px; text-align: left; }
.mini .e { font-size: 22px; }
.mini b { display: block; font: 700 15px/1.2 var(--f-display); margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini span { font-size: 12px; }
.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty .big { font-size: 40px; display: block; margin-bottom: 6px; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: 13px; margin-top: 12px; }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
#map { height: min(62dvh, 560px); min-height: 340px; border-radius: 18px; border: 1px solid var(--line); isolation: isolate; margin-top: 10px; background: var(--surface-2); }
.pin span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid #E2502A; font-size: 17px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pin.ev span { background: #E2502A; border-color: #fff; }
.pin.me span { width: 18px; height: 18px; margin: 8px; background: #2F6FED; border: 3px solid #fff; }

/* safety tab */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; }
.stat .k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .v { font: 700 22px/1.15 var(--f-display); margin-top: 4px; }
.stat .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.alert-card { padding: 14px; border-radius: 16px; background: var(--alert-soft); color: var(--alert); margin-bottom: 10px; }
.alert-card b { display: block; font-family: var(--f-display); font-size: 16px; }
.alert-card p { margin: 4px 0 0; font-size: 13px; color: var(--ink); }
.pad { padding: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
.field input, .field select { min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 400; font-size: 16px; width: 100%; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.tips.pad { padding: 16px; }
.tips li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 14px; }
.timer { font: 800 44px/1 var(--f-display); font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
.help-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.help-row:first-child { border-top: 0; padding-top: 0; }
.help-row:last-child { padding-bottom: 0; }
.help-row b { display: block; font-size: 15px; overflow-wrap: anywhere; }

/* check-in bar */
.cibar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin: 0 -16px 6px; background: var(--safe); color: var(--bg); font-weight: 600; font-size: 14px; width: calc(100% + 32px); border: 0; text-align: left; }
.cibar .t { margin-left: auto; font-variant-numeric: tabular-nums; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { border: 0; background: none; padding: 9px 0 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button span { font-size: 22px; filter: grayscale(1); opacity: .7; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] span { filter: none; opacity: 1; }

/* sheets */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--bg); width: 100%; max-width: 560px; max-height: 92dvh; margin: auto auto 0; border-radius: 24px 24px 0 0; overflow: auto; }
dialog::backdrop { background: rgba(10,8,5,.5); }
.sheet { padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); }
.sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.sheet h2 { font-size: 26px; overflow-wrap: anywhere; }
.hero { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 16px; margin-bottom: 12px; background: var(--surface-2); }
.kv { display: grid; grid-template-columns: 26px 1fr; gap: 8px 8px; margin: 14px 0; font-size: 15px; }
.kv > span { min-width: 0; overflow-wrap: anywhere; }
.results { display: grid; gap: 8px; margin-top: 10px; }
.results button { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
dialog.full { max-height: 100dvh; height: 100dvh; border-radius: 0; }
.center { min-height: 100%; display: grid; align-content: center; gap: 14px; text-align: center; }
.interest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.interest-grid button { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; text-align: left; }
.interest-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 100; max-width: 90vw; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .item { transition: transform .15s ease; } .item:active { transform: scale(.985); }
  dialog[open] { animation: up .28s cubic-bezier(.16,1,.3,1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">What's Happening<i>.</i></div>
    <button class="loc-btn" id="locBtn" aria-label="Change location">📍 <span id="locName">Set location</span></button>
    <button class="icon-btn" id="setBtn" aria-label="Settings">⚙️</button>
  </header>
  <button class="cibar" id="ciBar" hidden>🛟 <span id="ciBarLabel">Check-in running</span><span class="t" id="ciBarTime"></span></button>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main"><div>
  <button data-tab="discover"><span>✨</span>Discover</button>
  <button data-tab="places"><span>🗺️</span>Places</button>
  <button data-tab="safety"><span>🛟</span>Safety</button>
  <button data-tab="saved"><span>💛</span>My plan</button>
</div></nav>

<dialog id="sheet"></dialog>
<dialog id="overlay" class="full"></dialog>

<script src="config.js"></script>
<script src="vendor/leaflet.js" defer></script>
<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('wh.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('wh.' + k, JSON.stringify(v)); } catch {} },
};
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const minFmt = m => fmtTime(new Date(2000, 0, 1, 0, m));
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const isHttp = u => /^https?:\/\//i.test(u || '');
function distKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function offset(loc, km, bearingDeg) {
  const b = bearingDeg * Math.PI / 180;
  return { lat: loc.lat + (km * Math.cos(b)) / 111, lon: loc.lon + (km * Math.sin(b)) / (111 * Math.cos(loc.lat * Math.PI / 180)) };
}
const mapsUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${(+p.lat).toFixed(6)},${(+p.lon).toFixed(6)}`;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  t.setAttribute('role', 'status');
  (document.querySelector('dialog[open]') || document.body).append(t);
  setTimeout(() => t.remove(), 2800);
}
async function share(text) {
  try { if (navigator.share) return await navigator.share({ text }); } catch (err) { if (err?.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it to someone you trust.'); } catch { toast('Couldn’t share from this browser.'); }
}

/* ---------- state ---------- */
const CATS = [
  { id: 'food', label: 'Food & drink', ico: '🌮' }, { id: 'markets', label: 'Markets', ico: '🥕' },
  { id: 'music', label: 'Music & nightlife', ico: '🎵' }, { id: 'festivals', label: 'Festivals & fairs', ico: '🎪' },
  { id: 'movies', label: 'Movies', ico: '🎬' }, { id: 'arts', label: 'Arts & theatre', ico: '🎭' },
  { id: 'sports', label: 'Sports', ico: '🏟️' }, { id: 'outdoors', label: 'Outdoors', ico: '🌳' },
  { id: 'family', label: 'Family & fun', ico: '🎈' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const EMG = { US: '911', CA: '911', MX: '911', GB: '999', AU: '000', NZ: '111' };   // everything else: 112
const S = {
  tab: 'discover',
  loc: store.get('loc', null),               // {lat, lon, name, cc, gps}
  interests: store.get('interests', null),
  saved: store.get('saved', {}),
  contact: store.get('contact', { name: '', phone: '' }),
  emergency: store.get('emergency', null),   // set by hand; otherwise follows the country
  checkin: store.get('checkin', null),       // {due, label}
  set: { units: 'auto', radius: 6, tmKey: '', ...store.get('set', {}) },
  when: 'all', cat: 'foryou', kind: 'all', q: '', openNow: false, mapMode: false, limit: 60,
  wx: null, wxErr: false, alerts: [], places: null, help: null, placesErr: false,
  samples: [], live: null, evErr: '', stale: 0,
};
const imperial = () => S.set.units === 'imperial' || (S.set.units === 'auto' && /-(US|LR|MM)$/i.test(navigator.language || 'en-US'));
const tmKey = () => (S.set.tmKey || window.WH_CONFIG?.ticketmasterKey || '').trim();
const emergency = () => S.emergency || EMG[S.loc?.cc] || '112';
function fmtDist(km) {
  if (imperial()) { const mi = km * 0.621371; return mi < 0.1 ? 'Right here' : `${mi.toFixed(mi < 10 ? 1 : 0)} mi`; }
  return km < 1 ? `${Math.max(50, Math.round(km * 20) * 50)} m` : `${km.toFixed(km < 10 ? 1 : 0)} km`;
}
/* Wall-clock time at the chosen location. Event and opening times are all kept in this frame. */
function locNow() {
  const off = S.wx?.utc_offset_seconds;
  return off == null ? new Date() : new Date(Date.now() + off * 1000 + new Date().getTimezoneOffset() * 60000);
}
function dayLabel(d) {
  const diff = Math.round((startOfDay(d) - startOfDay(locNow())) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

/* ---------- opening hours (the common OpenStreetMap forms; anything else is shown as written) ---------- */
const DAY = ['su', 'mo', 'tu', 'we', 'th', 'fr', 'sa'], DAYNAME = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const hoursMemo = new Map();
function parseHours(str) {
  if (!str) return null;
  if (hoursMemo.has(str)) return hoursMemo.get(str);
  const out = (() => {
    const s = str.trim().toLowerCase();
    if (s === '24/7') return DAY.map(() => [[0, 1440]]);
    const week = DAY.map(() => null);
    for (const raw of s.split(';')) {
      const rule = raw.trim(); if (!rule) continue;
      const m = rule.match(/^([a-z ,\-]*?)\s*(off|closed|\d.*)$/); if (!m) return null;
      let days = [], onlyHoliday = false;
      for (const tok of m[1].split(',').map(t => t.trim()).filter(Boolean)) {
        if (tok === 'ph' || tok === 'sh') { onlyHoliday = true; continue; }
        const r = tok.split('-').map(t => DAY.indexOf(t.trim()));
        if (r.length > 2 || r.includes(-1)) return null;
        if (r.length === 1) days.push(r[0]); else for (let d = r[0]; ; d = (d + 1) % 7) { days.push(d); if (d === r[1]) break; }
      }
      if (!days.length) { if (onlyHoliday) continue; days = [0, 1, 2, 3, 4, 5, 6]; }
      let spans = [];
      if (m[2] !== 'off' && m[2] !== 'closed') for (const t of m[2].split(',')) {
        const x = t.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/); if (!x) return null;
        const a = +x[1] * 60 + +x[2]; let b = +x[3] * 60 + +x[4]; if (b <= a) b += 1440;
        if (a >= 1440 || b > 2880) return null;
        spans.push([a, b]);
      }
      for (const d of days) week[d] = spans;
    }
    const w = week.map(d => d || []);

/* ---------- map ---------- */
let map = null, mapSig = '';
const mapItems = () => [...placeList().slice(0, 140), ...events().filter(e => catMatch(e.cat) || S.kind === 'all').filter(e => S.kind === 'all' || e.cat === S.kind).slice(0, 40)];
function mountMap() {
  const el = $('#map'); if (!el) return;
  if (!window.L) { el.innerHTML = '<div class="empty">The map couldn’t load. Use the list instead.</div>'; return; }
  if (map) { map.remove(); map = null; }
  const items = mapItems(), here = [S.loc.lat, S.loc.lon];
  mapSig = items.length + S.kind + S.q + S.openNow;
  map = L.map(el, { zoomAnimation: false, fadeAnimation: false }).setView(here, 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  L.marker(here, { icon: L.divIcon({ className: 'pin me', html: '<span></span>', iconSize: [34, 34] }), title: 'You are here', interactive: false }).addTo(map);
  for (const it of items) {
    const ev = it.type === 'event';
    L.marker([it.lat, it.lon], { icon: L.divIcon({ className: 'pin' + (ev ? ' ev' : ''), html: `<span>${ev ? CAT[it.cat].ico : it.ico}</span>`, iconSize: [34, 34] }), title: it.title, alt: it.title, zIndexOffset: ev ? 500 : 0 })
      .addTo(map).on('click', () => openItem(it.id));
  }
  const near = items.slice().sort((a, b) => distKm(S.loc, a) - distKm(S.loc, b)).slice(0, 25).map(i => [i.lat, i.lon]);
  if (near.length) map.fitBounds(L.latLngBounds([here, ...near]), { padding: [28, 28], maxZoom: 16, animate: false });
}

/* ---------- render ---------- */
let pendingRender = false;
function render(soft) {
  $('#locName').textContent = S.loc ? S.loc.name : 'Set location';
  document.querySelectorAll('.tabs button').forEach(b => b.dataset.tab === S.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const view = $('#view');
  if (!S.loc) { view.innerHTML = ''; return; }
  if (soft) {   // background data arrived: don't wipe a field being typed in, or reset a map being explored
    const a = document.activeElement;
    if (a && view.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName)) { pendingRender = true; return; }
    if (S.tab === 'places' && S.mapMode && map && $('#map') && mapSig === mapItems().length + S.kind + S.q + S.openNow) return;
  }
  pendingRender = false;
  if (map) { map.remove(); map = null; }
  view.innerHTML = { discover: viewDiscover, places: viewPlaces, safety: viewSafety, saved: viewSaved }[S.tab]();
  if (S.tab === 'places' && S.mapMode) mountMap();

}

function icsFile(e) {

/* ---------- location, settings, onboarding ---------- */
const locKey = () => `${S.loc.lat.toFixed(3)},${S.loc.lon.toFixed(3)},${S.set.radius}`;
function saveCache() { store.set('cache', { k: locKey(), wx: S.wx, alerts: S.alerts, places: S.places, help: S.help, live: S.live }); }
const T = { wx: 0, pl: 0, ev: 0 };
function setLoc(loc) {
  S.loc = loc; store.set('loc', loc);
  Object.assign(S, { wx: null, places: null, help: null, alerts: [], live: null, wxErr: false, placesErr: false, evErr: '', stale: 0, limit: 60 });
  T.wx = T.pl = T.ev = 0;
  buildSamples(); render(); refresh();
}
function refresh(force) {
  if (!S.loc) return;
  const n = Date.now(), done = () => { saveCache(); render(true); };
  if (force || n - T.wx > 10 * 6e4) { T.wx = n; Promise.all([loadWeather(), loadAlerts()]).then(() => { buildSamples(); done(); }); }
  if (force || !S.places || n - T.pl > 6 * 36e5) { T.pl = n; loadPlaces().then(done); }
  if (force || n - T.ev > 30 * 6e4) { T.ev = n; loadEvents().then(done); }
}
async function reverseName(lat, lon) {
  try { const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`); return { name: j.city || j.locality || j.principalSubdivision || 'you', cc: j.countryCode || '' }; }
  catch { return { name: 'you', cc: '' }; }
}
function useGPS(statusEl) {
  if (!navigator.geolocation) { statusEl.textContent = 'This browser can’t share location. Search for a city instead.'; return; }
  statusEl.textContent = 'Finding you…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    closeSheets(); setLoc({ lat, lon, gps: true, ...(await reverseName(lat, lon)) }); afterLoc();
  }, () => { statusEl.textContent = 'Location is blocked or unavailable. Search for a city instead.'; }, { timeout: 10000, maximumAge: 300000 });
}
function followGPS() {   // if you came in by GPS and have walked on, keep distances honest
  if (!S.loc?.gps || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const p = { lat: pos.coords.latitude, lon: pos.coords.longitude }, moved = distKm(S.loc, p);
    if (moved > 2) setLoc({ ...p, gps: true, ...(await reverseName(p.lat, p.lon)) });
    else if (moved > 0.2) { Object.assign(S.loc, p); store.set('loc', S.loc); S.places?.sort((a, b) => distKm(S.loc, a) - distKm(S.loc, b)); buildSamples(); render(true); }
  }, () => {}, { timeout: 8000, maximumAge: 60000 });
}
async function searchCity(q, box) {
  if (q.trim().length < 2) return;
  box.innerHTML = '<span class="muted small">Searching…</span>';
  try {
    const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=6&language=en`);
    box.innerHTML = (j.results || []).map(r => `<button data-pick='${esc(JSON.stringify({ lat: r.latitude, lon: r.longitude, name: r.name, cc: r.country_code || '' }))}'><b>${esc(r.name)}</b> <span class="muted">${esc([r.admin1, r.country].filter(Boolean).join(', '))}</span></button>`).join('') || '<span class="muted small">No matches. Try a nearby city.</span>';
  } catch { box.innerHTML = '<span class="muted small">Search is unavailable right now.</span>'; }
}
const locForm = `<button class="btn primary block" data-act="gps">📍 Use my location</button>
  <p class="muted small" id="gpsStatus" role="status" style="min-height:18px;margin:8px 0"></p>
  <form id="cityForm" class="row" style="flex-wrap:nowrap"><input id="cityQ" aria-label="City" placeholder="Or search a city" style="flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px"><button class="btn" style="flex:none">Search</button></form>
  <div class="results" id="cityResults"></div>`;
function sheet(title, html) {
  const d = $('#sheet');
  d.innerHTML = `<div class="sheet"><div class="sheet-top"><h2>${title}</h2><button class="x icon-btn" data-act="close" aria-label="Close">✕</button></div>${html}</div>`;
  if (!d.open) d.showModal();
}
const openLocation = () => sheet('Where are you?', locForm);
function openSettings() {
  const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`;
  sheet('Settings', `
    <label class="field">Units<select id="sUnits">${opt('auto', 'Match my phone', S.set.units)}${opt('imperial', 'Miles and °F', S.set.units)}${opt('metric', 'Kilometres and °C', S.set.units)}</select></label>
    <label class="field">How far to look<select id="sRadius">${opt(2, 'Walking distance', S.set.radius)}${opt(6, 'Around town', S.set.radius)}${opt(15, 'Wider area', S.set.radius)}</select></label>
    <label class="field">Events key (Ticketmaster)<input id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.set.tmKey)}" placeholder="Paste your key"></label>
    <p class="muted small" style="margin:-4px 0 14px">Real concerts, games, shows and festivals need a free key from developer.ticketmaster.com. Without one, Discover shows sample events.${window.WH_CONFIG?.ticketmasterKey ? ' A key is already built into this copy of the app.' : ''}</p>
    <button class="btn primary block" data-act="save-settings">Save</button>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="interests">Edit interests</button><button class="btn" data-act="wipe">Clear my data</button></div>
    <p class="muted small" style="margin:14px 0 0">Your location, interests, trusted contact and saved plans stay on this device. Nothing is sent to a server of ours.</p>`);
}
function openWelcome() {
  const d = $('#overlay');
  d.innerHTML = `<div class="sheet center"><div style="font-size:54px">✨</div><h1 style="font-size:38px">What’s Happening<span style="color:var(--accent)">.</span></h1>
    <p class="muted" style="margin:0 auto;max-width:320px">Markets, music, movies, food and festivals around you, with a safety brief for every outing.</p>
    <div style="text-align:left;margin-top:8px">${locForm}</div></div>`;
  d.showModal();
}
function openInterests(first) {
  const d = first ? $('#overlay') : $('#sheet'), sel = new Set(S.interests || []);
  d.innerHTML = `<div class="sheet ${first ? 'center' : ''}"><div class="sheet-top"><h2>What are you into?</h2>${first ? '' : '<button class="x icon-btn" data-act="close" aria-label="Close">✕</button>'}</div>
    <p class="muted" style="margin:0 0 6px;text-align:left">Pick a few and “For you” will lead with them.</p>
    <div class="interest-grid">${CATS.map(c => `<button data-int="${c.id}" aria-pressed="${sel.has(c.id)}"><span aria-hidden="true">${c.ico}</span>${c.label}</button>`).join('')}</div>
    <button class="btn primary block" style="margin-top:14px" data-act="int-done">Done</button></div>`;
  if (!d.open) d.showModal();
}
function afterLoc() { if (S.interests == null) openInterests(true); }
function closeSheets() { for (const d of [$('#sheet'), $('#overlay')]) if (d.open) d.close(); }

/* ---------- check-in ---------- */
function startCheckin(due, label) {
  S.checkin = { due, label: label || '' }; store.set('checkin', S.checkin);
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  render(); toast(`Check-in set for ${dueLabel(due)}`);
}
function endCheckin(msg) { S.checkin = null; store.set('checkin', null); const o = $('#overlay'); if (o.open && o.dataset.kind === 'ci') o.close(); render(); if (msg) toast(msg); }
const dueLabel = ms => (dayKey(new Date(ms)) === dayKey(new Date()) ? '' : new Date(ms).toLocaleDateString([], { weekday: 'short' }) + ' ') + fmtTime(new Date(ms));
const smsHref = body => `sms:${S.contact.phone.replace(/[^\d+]/g, '')}?&body=${encodeURIComponent(body)}`;
async function notify(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, tag: 'checkin', icon: 'icons/icon-192.png' }); else new Notification(title, { body });
  } catch {}
}
function showDue() {
  const o = $('#overlay'); if (o.open && o.dataset.kind === 'ci') return;
  closeSheets(); o.dataset.kind = 'ci';
  const msg = `Checking in from ${S.checkin.label || 'my outing'}. I’m running late and wanted you to know.` + (S.loc ? ` Last area: ${S.loc.name}.` : ''), em = emergency();
  o.innerHTML = `<div class="sheet center"><div style="font-size:54px">🛟</div><h1 style="font-size:34px">Are you OK?</h1>
    <p class="muted" style="margin:0">Your check-in${S.checkin.label ? ' for ' + esc(S.checkin.label) : ''} is due.</p>
    <button class="btn safe block" data-act="ci-safe">I’m safe</button>
    <button class="btn block" data-act="ci-add">I need 30 more minutes</button>
    ${S.contact.phone ? `<a class="btn block" href="${esc(smsHref(msg))}">💬 Text ${esc(S.contact.name || 'my contact')}</a>` : '<p class="muted small" style="margin:0">Add a trusted contact in Safety to text them from here.</p>'}
    <a class="btn danger block" href="tel:${esc(em)}">📞 Call ${esc(em)}</a></div>`;
  o.showModal();
  notify('Are you OK?', 'Your check-in is due. Tap to respond.');
}
function tick() {
  const ci = S.checkin, bar = $('#ciBar');
  bar.hidden = !ci; if (!ci) return;
  const left = ci.due - Date.now(), s = Math.max(0, Math.floor(left / 1000));
  const txt = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  $('#ciBarLabel').textContent = left > 0 ? 'Check-in running' : 'Check-in due';
  $('#ciBarTime').textContent = txt;
  const big = $('#ciBig'); if (big) big.textContent = txt;
  if (left <= 0) showDue();
}
setInterval(tick, 1000);
function shareLocation() {
  if (!navigator.geolocation) return toast('This browser can’t read your location.');
  toast('Finding you…');
  navigator.geolocation.getCurrentPosition(pos => {
    const text = `I’m here right now: https://www.google.com/maps?q=${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    S.shareText = text;
    sheet('Your location is ready', `<p class="muted" style="margin:0 0 14px">Accurate to about ${Math.round(pos.coords.accuracy)} m. Send it to someone you trust.</p>
      <div class="row"><button class="btn safe" data-act="share-text">📲 Share</button>${S.contact.phone ? `<a class="btn" href="${esc(smsHref(text))}">💬 Text ${esc(S.contact.name || 'my contact')}</a>` : ''}</div>`);
  }, () => toast('Location is blocked or unavailable.'), { timeout: 10000, maximumAge: 30000, enableHighAccuracy: true });
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { S.tab = ds.tab; S.limit = 60; render(); scrollTo(0, 0); return; }
  if (ds.when) { S.when = ds.when; S.limit = 60; return render(); }
  if (ds.cat) { S.cat = ds.cat; S.limit = 60; return render(); }
  if (ds.kind) { S.kind = ds.kind; S.limit = 60; return render(); }
  if (ds.mode) { S.mapMode = ds.mode === 'map'; return render(); }
  if (ds.open) return openItem(ds.open);
  if (ds.pick) { closeSheets(); setLoc(JSON.parse(ds.pick)); return afterLoc(); }
  if (ds.int) return t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true');
  if (ds.ci) return startCheckin(Date.now() + ds.ci * 6e4);
  if (ds.save) {
    const it = findItem(ds.save); if (!it) return;
    if (S.saved[it.id]) delete S.saved[it.id]; else S.saved[it.id] = it;
    store.set('saved', S.saved); render(); return openItem(it.id);
  }
  if (ds.share) return share(planText(findItem(ds.share)));
  if (ds.ics) {
    const e = findItem(ds.ics), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([icsFile(e)], { type: 'text/calendar' })); a.download = 'event.ics';
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); return;
  }
  if (ds.ciEvent) { const e = findItem(ds.ciEvent); $('#sheet').close(); S.tab = 'safety'; return startCheckin(Date.now() + Math.max(e.end - +locNow() + 45 * 6e4, 30 * 6e4), e.title); }
  if (ds.ciPlace) { const p = findItem(ds.ciPlace); $('#sheet').close(); S.tab = 'safety'; return startCheckin(Date.now() + 120 * 6e4, p.title); }
  switch (ds.act) {
    case 'close': return t.closest('dialog').close();
    case 'gps': return useGPS($('#gpsStatus', t.closest('dialog')));
    case 'settings': return openSettings();
    case 'interests': return openInterests(false);
    case 'int-done': {
      S.interests = [...t.closest('dialog').querySelectorAll('[data-int][aria-pressed="true"]')].map(b => b.dataset.int);
      store.set('interests', S.interests); S.cat = 'foryou'; closeSheets(); return render();
    }
    case 'more': S.limit += 60; return render();
    case 'clear': S.when = 'all'; S.cat = 'all'; return render();
    case 'clear-places': S.kind = 'all'; S.q = ''; S.openNow = false; return render();
    case 'open-now': S.openNow = !S.openNow; S.limit = 60; return render();
    case 'retry': S.placesErr = S.wxErr = false; render(); return refresh(true);
    case 'share-loc': return shareLocation();
    case 'share-text': return share(S.shareText);
    case 'ci-safe': return endCheckin('Glad you’re safe. Check-in cleared.');
    case 'ci-add': { const o = $('#overlay'); if (o.open && o.dataset.kind === 'ci') o.close(); return startCheckin(Math.max(Date.now(), S.checkin.due) + 30 * 6e4, S.checkin.label); }
    case 'save-contact': {
      S.contact = { name: $('#cName').value.trim(), phone: $('#cPhone').value.trim() };
      const pick = $('#emg').value; S.emergency = pick === (EMG[S.loc?.cc] || '112') ? null : pick;
      store.set('contact', S.contact); store.set('emergency', S.emergency); render(); return toast('Saved on this device');
    }
    case 'save-settings': {
      const old = { ...S.set };
      S.set = { units: $('#sUnits').value, radius: +$('#sRadius').value, tmKey: $('#sKey').value.trim() }; store.set('set', S.set);
      $('#sheet').close();
      if (old.units !== S.set.units) T.wx = 0;
      if (old.radius !== S.set.radius) { T.pl = T.ev = 0; S.places = S.help = null; }
      if (old.tmKey !== S.set.tmKey) { T.ev = 0; S.live = null; S.evErr = ''; }
      render(); refresh(); return toast('Settings saved');
    }
    case 'wipe':
      if (!confirm('Clear your location, interests, trusted contact and saved plans from this device?')) return;
      try { Object.keys(localStorage).filter(k => k.startsWith('wh.')).forEach(k => localStorage.removeItem(k)); } catch {}
      return location.reload();
  }
});
document.addEventListener('submit', ev => { if (ev.target.id === 'cityForm') { ev.preventDefault(); searchCity($('#cityQ', ev.target).value, $('#cityResults', ev.target.parentElement)); } });
document.addEventListener('input', ev => {
  if (ev.target.id !== 'q') return;
  S.q = ev.target.value; S.limit = 60;
  if (S.mapMode) mountMap(); else $('#plist').innerHTML = placeListHTML();
});
document.addEventListener('error', ev => {   // a listing photo that won't load falls back to its emoji
  const t = ev.target; if (t.tagName !== 'IMG') return;
  if (t.parentElement?.dataset.ico) t.parentElement.textContent = t.parentElement.dataset.ico; else t.remove();
}, true);
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(true); }, 0));
$('#locBtn').addEventListener('click', openLocation);
$('#setBtn').addEventListener('click', openSettings);
$('#ciBar').addEventListener('click', () => { S.tab = 'safety'; render(); });
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') ev.target.close(); });
$('#overlay').addEventListener('cancel', ev => ev.preventDefault());   // welcome + check-in need an explicit answer
$('#overlay').addEventListener('close', ev => { delete ev.target.dataset.kind; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loc) { render(true); refresh(); followGPS(); } });
addEventListener('online', () => refresh(true));

/* ---------- boot ---------- */
if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.loc) {
  const c = store.get('cache', null);
  if (c && c.k === locKey()) Object.assign(S, { wx: c.wx, alerts: c.alerts || [], places: c.places, help: c.help, live: c.live });
  buildSamples(); render(); refresh(); afterLoc();
} else { render(); openWelcome(); }
</script>
</body>
</html>
